q____&quot;^15logseq____&quot;,[535,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Здесь написана сага о Ба Лы, или \\logseq____&quot;Сага о трех\\logseq____&quot;, друидическая история о трех Феях, которые в древние времена заботились о землях Баровии и, как мать любит своих собственных детей, лелеяли и их святые храмы.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^Flogseq____&quot;,582,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^Vlogseq____&quot;,582,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[535,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-76db-4c80-9216-2067cd97286clogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи не проявляли никакого интереса к миру смертных, которые жили за своими стенами и молились своим богам, ибо Феи были в долине задолго до появления королей и будут в долине еще долго после того, как короли уйдут.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Flogseq____&quot;,566,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Vlogseq____&quot;,580,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[536,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-6336-4a17-be86-de730cefbd5clogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Вскоре принц стал познавать военное искусство, он начал завоевывать все новые и новые земли, пока не дошел до земель, о которых ему рассказывала Водная Фея. Она отчачянно хотела дать ему силы и сделать его повелителем этих земель.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Flogseq____&quot;,567,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Vlogseq____&quot;,577,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[537,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-afd0-4408-9812-7a5603d1414dlogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о темных планах принца.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Flogseq____&quot;,555,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Vlogseq____&quot;,555,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[538,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-0a3e-4e2d-9340-a25418a5d741logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Flogseq____&quot;,551,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Vlogseq____&quot;,546,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[539,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-f0c0-4465-9fe2-ca87b1f04ed7logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Flogseq____&quot;,575,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Vlogseq____&quot;,575,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^Ulogseq____&quot;,529,536870981]],[logseq____&quot;^15logseq____&quot;,[540,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-02b5-4d38-8f30-2b329885aacalogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые люди пришли в долину, они узнали о трех Феях. Люди уважали Фей и видели в них богинь , которые заботились о долине. Когда люди научились жить в гармонии с природой, они создали [орден друидов]([[Орден друидов]]), чтобы отдавать дань уважения природному балансу, поскольку люди были гостями долины Фей.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Flogseq____&quot;,571,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Vlogseq____&quot;,571,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Ulogseq____&quot;,493,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Ulogseq____&quot;,528,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^Hlogseq____&quot;,528,536870981]],[logseq____&quot;^15logseq____&quot;,[541,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-1734-4ede-8001-c9e7b6880aa4logseq____& &quot;^15logseq____&quot;,[543,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-222a-42ba-ad47-4403875c3806logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Flogseq____&quot;,552,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Vlogseq____&quot;,530,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[544,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-eadf-4fa2-a8fe-91e153d03ad8logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[545,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые короли прибыли в [Баровию]([[Баровия]]), они принесли с собой свою религию [Повелителя Утра]([[Церковь Утреннего Владыки]]). Были воздвигнуты церкви, и Повелитель Утра благословил каждого короля править народом. Повелитель Утра дорожил своими прекрасными восходами, поэтому он следил за тем, чтобы всепроникающие утренние туманы [Баровии]([[Баровия]]) регулярно рассеивались. Благодаря этому посевы фермеров становились крепче и выше, но постепенно пышная растительность Баровии начала выгорать и увядать. В конце концов, жители деревень забыли о Феях и начали носить подношения королю и его Повелителю Утра за безопасность. Они строили стены вокруг своих деревень, чтобы защитить их от дикой природы, а [Церковь Повелителя Утра]([[Церковь Утреннего Владыки]]) проповедовала о зле язычества и Фей.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Flogseq____&quot;,580,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Vlogseq____&quot;,580,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Ulogseq____&quot;,60,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Ulogseq____&quot;,508,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Hlogseq____&quot;,60,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^Hlogseq____&quot;,508,536870981]],[logseq____&quot;^15logseq____&quot;,[547,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-41c4-4358-ba4e-d4b448b52db5logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[548,logseq____&quot;^Qlogseq____&quot;,logseq отной Феей, и теперь только мерзкие существа, населявшие то болото, приносили ей подношения.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Flogseq____&quot;,532,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Vlogseq____&quot;,577,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Ulogseq____&quot;,64,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^Hlogseq____&quot;,64,536870981]],[logseq____&quot;^15logseq____&quot;,[556,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-f0b2-428d-ae80-09d34896f4aflogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей одинокой башне, чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Flogseq____&quot;,586,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Vlogseq____&quot;,586,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Ulogseq____&quot;,519,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Ulogseq____&quot;,520,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Ulogseq____&quot;,527,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Hlogseq____&quot;,519,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^Hlogseq____&quot;,527,536870981]],[logseq____&quot;^15logseq____&quot;,[557,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-a3d1-4e1c-9b53-8a3dcb6d23a7logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В скором времени Болотная Фея начала ожесточаться, видя как новые приключенцы попадают в эти земли и пытаются убить ее столь любимого \\logseq____&quot;сына\\logseq____&quot;.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Flogseq____&quot;,556,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq_ ов до тех пор, пока не смогли бы найти тех, кто достаточно силен, чтобы противостоять принцу, а затем сделали бы их теми, кто смог бы противостоять в битве против этого мастера тактики.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^Flogseq____&quot;,533,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^Vlogseq____&quot;,555,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[585,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-8253-49ad-9fe4-2984445d8a3elogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[Янтарный храм]([[Янтарный храм]])logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Flogseq____&quot;,546,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Xlogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Vlogseq____&quot;,582,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Ulogseq____&quot;,159,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Ulogseq____&quot;,520,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^Hlogseq____&quot;,520,536870981]],[logseq____&quot;^15logseq____&quot;,[586,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a7109d0-70c4-42aa-b216-31855be70f6alogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[588,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;template-type:: location\\ntype:: Цер
