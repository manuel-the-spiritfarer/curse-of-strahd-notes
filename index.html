____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о темных планах принца.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Flogseq____&quot;,693,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Vlogseq____&quot;,693,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-456e-4303-b4f4-a4d2cecc4693logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Этот орден друидов создал три каменных круга, известных как Храмы, каждый из которых предназначался своей Фее. Первый каменный круг был построен на краю леса как дань уважения Лесной Фее. Еще один храм был построен вдоль реки как дань уважения Водной Фее. Третий же храм был построен на холме, обращенный к великим горам, как дань уважения Горной Фее.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Flogseq____&quot;,722,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Vlogseq____&quot;,722,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-eac1-4a5c-8610-199c66c001d0logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Друиды, чьи верования больше не приветствовались в деревнях, переехали в небольшую рощу в дальнем уголке Баровии и навсегда бросили молодое королевство на произвол судьбы. Друиды продолжали носить подношения Феям. Фермеры, втайне, чтобы не проявить неуважения к королю и его Утреннему Лорду, также приносили подношения Феям, поскольку они знали, что именно Феи были стражами, которые защищали землю и обеспечивали гармонию в долине.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Flogseq____&quot;,721,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Vlogseq____&quot;,677,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-a487-4181-b254-d7702e39fbedlogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Flogseq____&quot;,701,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Vlogseq____&quot;,707,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[682,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-524b-427e-9201-b83c3ea70766logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Все те злодеяния, что сотворила Водяная Фея, не остались незамеченными. Город [Берез]([[Берез]]), что находился рядом с ее Храмом по приказу темного принца погрузился в болота и пришел в упадок. Так она стала Болотной Феей, и теперь только мерзкие существа, населявшие то болото, приносили ей подношения.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Flogseq____&quot;,719,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Vlogseq____&quot;,691,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Ulogseq____&quot;,64,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^Hlogseq____&quot;,64,536870988]],[logseq____&quot;^15logseq____&quot;,[683,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-0a95-47ea-9b49-f3177a083bc6logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Помогая королеве, ухаживая за ней, она стала приближенной королевского двора и вскоре при рождении принца стала его повитухой. И с первых же мгновений жизни она возлюбила это дитя как собственное, несмотря на то, что сам принц за время, проведенное с Феей, не питал ни любви, ни теплых чувств к ней.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Flogseq____&quot;,697,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Vlogseq____&quot;,691,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[684,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-e5ae-4ded-8ad4-b0ed008fc8d3logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Принц слышал о легендарных Феях, но не обращал на них внимания во время великой войны, считая их всего лишь мифом. Однако, узнав об их силе и самоцветах, он не мог позволить им разгуливать на свободе. Он заключил в тюрьму Водную Фею и приказал своим приспешникам осквернить Храмы, найти другие половинки трех самоцветов и захватить Фей в плен.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Flogseq____&quot;,723,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Vlogseq____&quot;,678,536870988]],[logseq____&quot;^15logseq____&quot;,[685,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logs покрыта облаками и туманами, которые сохраняли флору здоровой и красивой. Однако недостаточная видимость представляла собой головоломку для людей, пытающихся отследить сезон посадки с помощью неба.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^Flogseq____&quot;,698,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^Vlogseq____&quot;,698,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[726,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-4b19-444d-a041-4b32a8d87e6flogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Flogseq____&quot;,678,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Vlogseq____&quot;,678,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^Ulogseq____&quot;,674,536870988]],[logseq____&quot;^15logseq____&quot;,[727,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-0590-461f-b641-69145c9a3276logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи оставили свои самоцветы в своих Храмах, приказав ордену друидов закопать самоцветы под кругами монолитов. Во время весеннего равноденствия, летнего солнцестояния, осеннего равноденствия и зимнего солнцестояния на каждом храме светился символ, говорящий друидам о том, когда фермерам Баровии следует сажать и убирать урожай. Символы также указывали, когда владельцы ферм должны перегонять свои стада на свежие летние пастбища, а когда возвращать их домой на зиму.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Flogseq____&quot;,690,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Vlogseq____&quot;,690,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^Ulogseq____&quot;,672,536870988]],[logseq____&quot;^15logseq____&quot;,[728,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-f575-430d-a9d7-6c3e99a31276logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Цветок Тсер на день весеннего равноденствияlogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Flogseq____&quot;,730,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Vlogseq____&quot;,730,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[729,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-3d7c-42dd-a777-bb62e477654blogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;На протяжении веков люди жили в долине в гармонии с природой и чувствовали себя благословленными Феями. Четыре раза в год друиды искали знаки в храмах, читали ритуальные стихи и приносили подарки Феям:logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Flogseq____&quot;,717,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Vlogseq____&quot;,717,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-930f-45c2-9cf2-5c0c64897c4clogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей одинокой башне, чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Flogseq____&quot;,700,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Vlogseq____&quot;,700,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ulogseq____&quot;,664,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ulogseq____&quot;,665,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ulogseq____&quot;,672,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Hlogseq____&quot;,664,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Hlogseq____&quot;,672,536870988]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade36-a8fd-40f4-86b6-0c98cb2473f5logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;template-type:: location\\ntype:: Церковь\\n\\nlogseq____&quot;,536870989]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Ologse       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
