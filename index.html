t;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^Flogseq____&quot;,401,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^Vlogseq____&quot;,401,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^Ulogseq____&quot;,371,536870965]],[logseq____&quot;^15logseq____&quot;,[394,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-304c-49b2-a10d-03b76eb9f5c8logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей одинокой башне, чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Flogseq____&quot;,415,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Vlogseq____&quot;,415,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Ulogseq____&quot;,382,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Ulogseq____&quot;,383,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Ulogseq____&quot;,390,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Hlogseq____&quot;,382,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^Hlogseq____&quot;,390,536870965]],[logseq____&quot;^15logseq____&quot;,[395,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-58a9-4b07-b71b-0fd7fc9dca8alogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые люди пришли в долину, они узнали о трех Феях. Люди уважали Фей и видели в них богинь , которые заботились о долине. Когда люди научились жить в гармонии с природой, они создали [орден друидов]([[Орден друидов]]), чтобы отдавать дань уважения природному балансу, поскольку люди были гостями долины Фей.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Flogseq____&quot;,405,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Vlogseq____&quot;,405,536870965]],[logseq____&quot;^15logseq____&quot;,[396,logseq____&quot;^Ulo ых же мгновений жизни она возлюбила это дитя как собственное, несмотря на то, что сам принц за время, проведенное с Феей, не питал ни любви, ни теплых чувств к ней.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^Flogseq____&quot;,408,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^Vlogseq____&quot;,426,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[398,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-da69-41c5-87b9-7b4fdeb83905logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Друиды, чьи верования больше не приветствовались в деревнях, переехали в небольшую рощу в дальнем уголке Баровии и навсегда бросили молодое королевство на произвол судьбы. Друиды продолжали носить подношения Феям. Фермеры, втайне, чтобы не проявить неуважения к королю и его Утреннему Лорду, также приносили подношения Феям, поскольку они знали, что именно Феи были стражами, которые защищали землю и обеспечивали гармонию в долине.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Flogseq____&quot;,407,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Vlogseq____&quot;,439,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[399,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6c емнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Flogseq____&quot;,448,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Vlogseq____&quot;,428,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-02b3-4510-b72d-f6516a943681logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Здесь написана сага о Ба Лы, или \\logseq____&quot;Сага о трех\\logseq____&quot;, друидическая история о трех Феях, которые в древние времена заботились о землях Баровии и, как мать любит своих собственных детей, лелеяли и их святые храмы.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Flogseq____&quot;,411,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Vlogseq____&quot;,411,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[417,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-8463-4edf-aa39-09f1dbf9 seq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[437,logseq____&quot;^Hlogseq____&quot;,41,536870965]],[logseq____&quot;^15logseq____&quot;,[437,logseq____&quot;^Hlogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[437,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-2e37-434e-afa9-45cfde2114cdlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Их следующие шаги казались еще более сложными, чем могли бы вынести их истощающиеся силы; им нужно было добыть голубой самоцвет, спасти Водную Фею и восстановить разрушенный Храм. Только тогда три Феи и их самоцветы могли объединиться, чтобы победить темного принца. Им нужно было найти других героев, заслуживающих доверия и достаточно сильных, чтобы противостоять темному принцу и его приспешникам. В долине не было никого, к кому они могли бы обратиться, и им пришлось бы найти по-настоящему могущественных и стойких приключенцев, которые помогли бы им. Феи прятались от темного принца и его приспешников до тех пор, пока не смогли бы найти тех, кто достаточно силен, чтобы противостоять принцу, а затем сделали бы их теми, кто смог бы противостоять в битве против этого мастера тактики.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Flogseq____&quot;,419,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Vlogseq____&quot;,409,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[438,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-c03e-47c1-b47b-4e28c10a8494logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot и больше не верили в Фей. На протяжении многих поколений они поклонялись Повелителю Утра и платили дань своему новому повелителю Баровии, темному принцу.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Flogseq____&quot;,435,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Vlogseq____&quot;,409,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ulogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Hlogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc886-8b4c-4e04-a9b1-f9b31023857dlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[Принц]([[Страд фон Зарович]]) прибыл в долину со своей армией, чтобы объявить эту землю своим королевством. Его армия была могущественной, а его сосредоточенность и способность к сражению были велики. Война принесла разрушения в долину, и впервые Феи обратили внимание на уничтожение людей на самой земле.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Flogseq____&quot;,428,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Vlogseq____&quot;,428,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Ulogseq____&quot;,72,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&
