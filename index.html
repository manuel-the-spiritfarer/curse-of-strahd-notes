]],[logseq____&quot;^15logseq____&quot;,[760,logseq____&quot;^Blogseq____&quot;,1789996361499,536870994]],[logseq____&quot;^15logseq____&quot;,[760,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-fb49-4b1b-86d2-71f8c7cb613alogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^Klogseq____&quot;,1789996361500,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^@logseq____&quot;,false,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^Ylogseq____&quot;,logseq____&quot;сердце скорбиlogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^11logseq____&quot;,logseq____&quot;Сердце Скорбиlogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^Blogseq____&quot;,1789996361500,536870994]],[logseq____&quot;^15logseq____&quot;,[761,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-bbb0-4862-aaff-15769eeead46logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Водная Фея приняла человеческий облик и отправилась в замок принца, чтобы принести ему этот великий дар. Она объяснила, что тяжелое сердце принца исказило туманы, которые покрыли землю тьмой.  С Сердцем Скорби, извлекающим боль о своей потерянной любви, принц освободился бы от отчаяния и угрызений совести, которые сковывали его, восстановив землю и свое королевство. Принц был доволен подарком и магической силой Сердца Скорби, придавшей ему безудержного рвения к новому делу.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Flogseq____&quot;,778,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Vlogseq____&quot;,784,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^Ulogseq____&quot;,761,536870994]],[logseq____&quot;^15logseq____&quot;,[762,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-9ad8-4887-aabb-99bc233e5145logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Flogseq____&quot;,787,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Vlogseq____&quot;,807,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[763,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-1f7d-4d1d-8656-7e96145ee5d6logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Друиды, чьи верования больше не приветствовались в деревнях, переехали в небольшую рощу в дальнем уголке Баровии и навсегда бросили молодое королевство на произвол судьбы. Друиды продолжали носить подношения Феям. Фермеры, втайне, чтобы не проявить неуважения к королю и его Утреннему Лорду, также приносили подношения Феям, поскольку они знали, что именно Феи были стражами, которые защищали землю и обеспечивали гармонию в долине.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Flogseq____&quot;,765,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Vlogseq____&quot;,799,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[764,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-dae1-45a0-8655-f01beb4521e3logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[765,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые короли прибыли в [Баровию]([[Баровия]]), они принесли с собой свою религию [Повелителя Утра]([[Церковь Утреннего Владыки]]). Были воздвигнуты церкви, и Повелитель Утра благословил каждого короля править народом. Повелитель Утра дорожил своими прекрасными восходами, поэтому он следил за тем, чтобы всепроникающие утренние туманы [Баровии]([[Баровия]]) регулярно рассеивались. Благодаря этому посевы фермеров становились крепче и выше, но постепенно пышная растительность Баровии начала выгорать и увядать. В конце концов, жители деревень забыли о Феях и начали носить подношения королю и его Повелителю Утра за безопасность. Они строили стены вокруг своих деревень, чтобы защитить их от дикой природы, а [Церковь Повелителя Утра]([[Церковь Утреннего Владыки]]) проповедовала о зле язычества и Фей.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[765,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[765,logseq____&quot;^Flogseq____&quot;,799,536870994]],[l _&quot;,54,536870994]],[logseq____&quot;^15logseq____&quot;,[771,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-f9f1-4ff9-8d74-4a6cd9b1944clogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В туманах было что-то неопределимое. Казалось, у них был свой собственный разум. Туман окутал долину, и круговорот жизни землился. Признаки зарождения жизни весной исчезли, животные рождались с пустыми темными глазами, цветы больше не распускались, а яйца были черными. В лесах появились новые ужасные существа, посевы начали гнить, и земля потемнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Flogseq____&quot;,797,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Vlogseq____&quot;,809,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[772,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-3e0c-4505-9532-54bfc459b0bblogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Содержание:logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Flogseq____&quot;,796,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Vlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[773,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-b6ae-44d4-8316-8831db3fd9cflogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Flogseq____&quot;,772,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Vlogseq____&quot;,809,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[774,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-246e-40d0-abed-44fd0399f5d4logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о темных планах принца.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Flogseq____&quot;,766,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Vlogseq____&quot;,766,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[775,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-85a9-479c-a625-b109f883e90flogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Баровия была богатой и пышной плодородной горной долиной и часто была покрыта облаками и туманами, которые сохраняли флору здоровой и красивой. Однако недостаточная видимость представляла собой головоломку для людей, пытающихся отследить сезон посадки с помощью неба.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Flogseq____&quot;,780,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Vlogseq____&quot;,780,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^Ulogseq____&quot;,655,536870994]],[logseq____&quot;^15logseq____&quot;,[776,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-9dc3-4875-83fe-41d96b0a61eflogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;До того, как смертные поселились в долине, известной как Баровия, три небесных существа - сестры Феи - следили за флорой, фауной и землей. Вместе в своем единстве они были Матерью-природой, заботящейся о долине. Каждая из сестер-Фей по-своему дарила долине свою любовь и заботу:logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Flogseq____&quot;,808,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Vlogseq____&quot;,808,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^Ulogseq____&quot;,720,536870994]],[logseq____&quot;^15logseq____&quot;,[777,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-9048-4004-b28e-08778cacbdeclogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Flogseq____&quot;,784,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Vlogseq____&quot;,784,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^Ulogseq____&quot;,761,536870994]],[logseq____&quot;^15logseq____&quot;,[778,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-6660-4e3f-9e74-2f2a2acebf35logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Их сестру заперли, а их храмы осквернили, Сестры-Феи спрятали два оставшихся самоцвета. Лесная Фея доверила свой зеленый самоцвет воронам-оборотням, которые показали себя как благородные и преданные создания. Горная Фея доверила свой красный самоцвет старому волшебнику, живущему в башне, которого она знала и которому доверяла. ([Хазан]([[Хазан]]))logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Flogseq____&quot;,789,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Vlogseq____&quot;,766,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Ulogseq____&quot;,752,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^Hlogseq____&quot;,752,536870994]],[logseq____&quot;^15logseq____&quot;,[779,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-7ee9-46c7-8d81-cb5deb58ca1blogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[780,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[Самоцветы Фей]([[Самоцветы Фей]])logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[780,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[780,logs м о том, когда фермерам Баровии следует сажать и убирать урожай. Символы также указывали, когда владельцы ферм должны перегонять свои стада на свежие летние пастбища, а когда возвращать их домой на зиму.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Flogseq____&quot;,793,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Vlogseq____&quot;,793,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Ulogseq____&quot;,655,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^Ulogseq____&quot;,656,536870994]],[logseq____&quot;^15logseq____&quot;,[782,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-2e4f-4d7a-9dab-703518e33215logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ, чтобы уничтожить всех врагов темного принца и деревни смертных, которых она винит во всем, что произошло.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Flogseq____&quot;,795,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Vlogseq____&quot;,768,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Ulogseq____&quot;,63,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Ulogseq____&quot;,67,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Hlogseq____&quot;,63,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^Hlogseq____&quot;,67,536870994]],[logseq____&quot;^15logseq____&quot;,[783,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-9fd7-4708-a63f-ea9b25d01d29logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[Сердце скорби]([[Сердце Скорби]])logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Flogseq____&quot;,809,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Vlogseq____&quot;,773,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Ulogseq____&quot;,761,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^Hlogseq____&quot;,761,536870994]],[logseq____&quot;^15logseq____&quot;,[784,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-135d-4d62-8369-15f31d482121logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Принц слышал о легендарных Феях, но не обращал на них внимания во время великой войны, считая их всего лишь мифом. Однако, узнав об их силе и самоцветах, он не мог позволить им разгуливать на свободе. Он заключил в тюрьму Водную Фею и приказал своим приспешникам осквернить Храмы, найти другие половинки трех самоцветов и захватить Фей в плен.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Flogseq____&quot;,762,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Vlogseq____&quot;,784,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^Ulogseq____&quot;,761,536870994]],[logseq____&quot;^15logseq____&quot;,[785,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-2d5b-483c-8763-9d68c09ad0d3logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В самый длинный день лета, в день летнего солнцестояния, когда солнце было в зените, друиды приходили к каждому из Храмов, возлагали цветы вокруг монолитов и благодарили Фей за чудесную весну. В самую длинную ночь, в день зимнего солнцестояния, друиды зажигали свечи и приносили свежие, теплые буханки хлеба в качестве подарков, чтобы согреть Фей долгими зимними ночами.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Flogseq____&quot;,794,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Xlogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Vlogseq____&quot;,810,536870994]],[logseq____&quot;^15logseq____&quot;,[786,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____& ogseq____&quot;^Ulogseq____&quot;,67,536870994]],[logseq____&quot;^15logseq____&quot;,[817,logseq____&quot;^Ulogseq____&quot;,174,536870994]],[logseq____&quot;^15logseq____&quot;,[817,logseq____&quot;^Hlogseq____&quot;,67,536870994]],[logseq____&quot;^15logseq____&quot;,[817,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6ab12d49-9748-44ab-9470-b222936fe64flogseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[818,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей [одинокой башне]([[Одинокая Башня]]), чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[818,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870994]],[logseq____&quot;^15logseq____&quot;,[818,logseq____&quot;^Flogseq____&quot;,806,536870994]],[logseq____&quot;^15logseq____&quot;,[818,logseq____&quot;^Xlogseq       // This script checks to see if a redirect is present in the query string
      // and converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var a = v.split('=');
            q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window.location))</script>
