ла свой красный самоцвет старому волшебнику, живущему в башне, которого она знала и которому доверяла. ([Хазан]([[Хазан]]))logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Flogseq____&quot;,719,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Vlogseq____&quot;,692,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Ulogseq____&quot;,678,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^Hlogseq____&quot;,678,536870991]],[logseq____&quot;^15logseq____&quot;,[696,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-0e34-41e9-b0e6-846889e532d3logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Flogseq____&quot;,713,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Vlogseq____&quot;,721,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[697,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-9abf-4b0f-9e31-e9dbb59add1blogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ, чтобы уничтожить всех врагов темного принца и деревни смертных, которых она винит во всем, что произошло.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Flogseq____&quot;,690,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Vlogseq____&quot;,693,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Ulogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Ulogseq____&quot;,64,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Hlogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^Hlogseq____&quot;,64,536870991]],[logseq____&quot;^15logseq____&quot;,[698,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-41e0-4eaf-a4cc-2bef8dfadbe8logseq____&quot;,536870991]],[logse seq____&quot;^Ulogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,242,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,679,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Hlogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Hlogseq____&quot;,242,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Hlogseq____&quot;,679,536870991]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-9012-4bbe-b281-921d9ac51d9flogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Друиды, чьи верования больше не приветствовались в деревнях, переехали в небольшую рощу в дальнем уголке Баровии и навсегда бросили молодое королевство на произвол судьбы. Друиды продолжали носить подношения Феям. Фермеры, втайне, чтобы не проявить неуважения к королю и его Утреннему Лорду, также приносили подношения Феям, поскольку они знали, что именно Феи были стражами, которые защищали землю и обеспечивали гармонию в долине.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Flogseq____&quot;,703,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Vlogseq____&quot;,724,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[741,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-d56a-4828-91bc-6ec79b32b73flogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Водная Фея приняла человеческий облик и отправилась в замок принца, чтобы принести ему этот великий дар. Она объяснила, что тяжелое сердце принца исказило туманы, которые покрыли землю тьмой.  С Сердцем Скорби, извлекающим боль о своей потерянной любви, принц освободился бы от отчаяния и угрызений совести, которые сковывали его, восстановив землю и свое королевство. Принц был доволен подарком и магической силой Сердца Скорби, придавшей ему безудержного рвения к новому делу.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Flogseq____&quot;,743,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Vlogseq____&quot;,710,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^Ulogseq____&quot;,687,536870991]],[logseq____&quot;^15logseq____&quot;,[742,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ae0c4-5ae6-4b00-a7a6-b7c2d9ceec46logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[743,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[743,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq__
