ияlogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^Flogseq____&quot;,491,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^Vlogseq____&quot;,491,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[464,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-1ce2-4a14-866d-aceaf7c862b0logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;До того, как смертные поселились в долине, известной как Баровия, три небесных существа - сестры Феи - следили за флорой, фауной и землей. Вместе в своем единстве они были Матерью-природой, заботящейся о долине. Каждая из сестер-Фей по-своему дарила долине свою любовь и заботу:logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Flogseq____&quot;,499,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Vlogseq____&quot;,499,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^Ulogseq____&quot;,429,536870973]],[logseq____&quot;^15logseq____&quot;,[465,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-cb00-4e47-803a-4f93aa4cb4dclogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Со временем Феи поняли, что люди и их орден друидов стали частью жизненного цикла долины. Феи отважились забраться в [гору, полную янтаря]([[Янтарная гора]]), который мог использовать магию и силу. Каждая Фея собрала с горы осколок янтаря и создала самоцвет Феи, вложив в каждый этот самоцвет изрядную долю своей небесной магии.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Flogseq____&quot;,511,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Vlogseq____&quot;,478,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Ulogseq____&quot;,453,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^Hlogseq____&quot;,453,536870973]],[logseq____&quot;^15logseq____&quot;,[466,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-1f89-4801-a735-dc9b70b00517logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Помогая королеве, ухаживая за ней, она стала приближенной королевского двора и вскоре при рождении принца стала его повитухой. И с первых же мгновений жизни она возлюбила это дитя как собственное, несмотря на то, что сам принц за время, проведенное с Феей, не питал ни любви, ни теплых чувств к ней.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Flogseq____&quot;,486,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Vlogseq____&quot;,507,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[467,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-2b10-4165-ad6a-80e82eeb199clogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Flogseq____&quot;,460,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Vlogseq____&quot;,460,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^Ulogseq____&quot;,455,536870973]],[logseq____&quot;^15logseq____&quot;,[468,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-9055-4cd6-9d3f-9a66a89123d6logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[469,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Считается, что Болотная Фея с дьявольской гордостью взяла себе имя Баба Лысага.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[469,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[469,logseq____&quot;^Flogseq____&quot;,457,536870973]],[logseq____&quot;^15logseq____&quot;,[469,logseq___ цестояния на каждом храме светился символ, говорящий друидам о том, когда фермерам Баровии следует сажать и убирать урожай. Символы также указывали, когда владельцы ферм должны перегонять свои стада на свежие летние пастбища, а когда возвращать их домой на зиму.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Flogseq____&quot;,466,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Vlogseq____&quot;,466,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^Ulogseq____&quot;,453,536870973]],[logseq____&quot;^15logseq____&quot;,[471,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-2b7b-476e-b77a-f6cf887c3d03logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[472,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[472,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[472,logseq____&quot;^Flogseq____&quot;,491,536870973]],[logseq____&quot;^15logseq____&quot;,[472,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot ___&quot;^15logseq____&quot;,[474,logseq____&quot;^Vlogseq____&quot;,462,536870973]],[logseq____&quot;^15logseq____&quot;,[474,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[474,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-b050-4f1c-ac10-4aef28ec79delogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В туманах было что-то неопределимое. Казалось, у них был свой собственный разум. Туман окутал долину, и круговорот жизни землился. Признаки зарождения жизни весной исчезли, животные рождались с пустыми темными глазами, цветы больше не распускались, а яйца были черными. В лесах появились новые ужасные существа, посевы начали гнить, и земля потемнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Flogseq____&quot;,497,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Vlogseq____&quot;,484,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[475,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-56f1-4161-b83e-e92eb1426c8dlogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Все те злодеяния, что сотворила Водяная Фея, не остались незамеченными. Город [Берез]([[Берез]]), что находился рядом с ее Храмом по приказу темного принца погрузился в болота и пришел в упадок. Так она стала Болотной Феей, и теперь только мерзкие существа, населявшие то болото, приносили ей подношения.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Flogseq____&quot;,461,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Vlogseq____&quot;,507,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Ulogseq____&quot;,57,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^Hlogseq____&quot;,57,536870973]],[logseq____&quot;^15logseq____&quot;,[476,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-a69d-4282-92e9-5749f35cd44dlogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;[Принц]([[Страд фон Зарович]]) прибыл в долину со своей армией, чтобы объявить эту землю своим королевством. Его армия была могущественной, а его сосредоточенность и способность к сражению были велики. Война принесла разрушения в долину, и впервые Феи обратили внимание на уничтожение людей на самой земле.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Flogseq____&quot;,484,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Vlogseq____&quot;,484,536870973]],[logseq____&quot;^15logseq____&quot;,[477,logseq____&quot;^Ulogseq____&quot;,89,536870973]],[logseq____&quot;^1 eq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Их сестру заперли, а их храмы осквернили, Сестры-Феи спрятали два оставшихся самоцвета. Лесная Фея доверила свой зеленый самоцвет воронам-оборотням, которые показали себя как благородные и преданные создания. Горная Фея доверила свой красный самоцвет старому волшебнику, живущему в башне, которого она знала и которому доверяла. ([Хазан]([[Хазан]]))logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Flogseq____&quot;,463,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Vlogseq____&quot;,458,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Ulogseq____&quot;,445,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^Hlogseq____&quot;,445,536870973]],[logseq____&quot;^15logseq____&quot;,[485,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-0d17-402a-bc99-ae6ab385b79clogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В тайне от своих сестер Водная Фея путешествовала по миру. И однажды, она встретила короля и королеву, что ожидали дитя, своего первенца. Фея увидела великое будущее еще не родившегося ребенка.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Flogseq____&quot;,507,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Vlogseq____&quot;,507,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[486,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-4a51-45f4-845a-e6053b4159bblogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[487,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей одинокой башне, чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[487,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[487,logseq____&quot;^Flogseq____&quot;,459,536870973]],[logseq____&quot;^15logseq____&quot;,[487,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[487,logseq____&quot;^Vlogseq____&quot;,4 ал на них внимания во время великой войны, считая их всего лишь мифом. Однако, узнав об их силе и самоцветах, он не мог позволить им разгуливать на свободе. Он заключил в тюрьму Водную Фею и приказал своим приспешникам осквернить Храмы, найти другие половинки трех самоцветов и захватить Фей в плен.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Flogseq____&quot;,504,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Vlogseq____&quot;,460,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^Ulogseq____&quot;,455,536870973]],[logseq____&quot;^15logseq____&quot;,[489,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-e54b-452d-9c9f-1e2704fc95e6logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Храмы, круги монолитовlogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Flogseq____&quot;,499,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Vlogseq____&quot;,509,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[490,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-7e51-4b3a-8931-e7988fb78daclogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;На протяжении веков люди жили в долине в гармонии с природой и чувствовали себя благословленными Феями. Четыре раза в год друиды искали знаки в храмах, читали ритуальные стихи и приносили подарки Феям:logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Flogseq____&quot;,473,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Vlogseq____&quot;,473,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[491,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-ccc0-4779-bb99-925210eeaf9dlogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о темных планах принца.logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Flogseq____&quot;,458,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Xlogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Vlogseq____&quot;,458,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^Ulogseq____&quot;,147,536870973]],[logseq____&quot;^15logseq____&quot;,[492,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6db6dd-84c2-4ca5-8705-c90156756cdflogseq____&quot;,536870973]],[logseq____&quot;^15logseq____&quot;,[493,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Лесная Фея превратилась в
