_&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Flogseq____&quot;,749,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Vlogseq____&quot;,732,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[730,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-6d80-4a57-a20f-f07cfe5741b2logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи не проявляли никакого интереса к миру смертных, которые жили за своими стенами и молились своим богам, ибо Феи были в долине задолго до появления королей и будут в долине еще долго после того, как короли уйдут.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Flogseq____&quot;,726,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Vlogseq____&quot;,703,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[731,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-3d22-451a-b8b2-1f36c208c60blogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Великая Войнаlogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Flogseq____&quot;,703,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Vlogseq____&quot;,720,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[732,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-69ff-40c0-ac47-d56a8e245681logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Помогая королеве, ухаживая за ней, она стала приближенной королевского двора и вскоре при рождении принца стала его повитухой. И с первых же мгновений жизни она возлюбила это дитя как собственное, несмотря на то, что сам принц за время, проведенное с Феей, не питал ни любви, ни теплых чувств к ней.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Flogseq____&quot;,714,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Vlogseq____&quot;,721,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[733,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-c51c-4b17-8b46-b19f6881cac7logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Водная Фея следила за дождем, озерами и рекамиlogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Flogseq____&quot;,741,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Vlogseq____&quot;,728,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^Ulogseq____&quot;,660,536870992]],[logseq____&quot;^15logseq____&quot;,[734,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-5296-4271-be41-280e68456921logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В самый длинный день лета, в день летнего солнцестояния, когда солнце было в зените, друиды приходили к каждому из Храмов, возлагали цветы вокруг монолитов и благодарили Фей за чудесную весну. В самую длинную ночь, в день зимнего солнцестояния, друиды зажигали свечи и приносили свежие, теплые буханки хлеба в качестве подарков, чтобы согреть Фей долгими зимними ночами.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Flogseq____&quot;,704,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Vlogseq____&quot;,705,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[735,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-a77e-4ee7-abfc-a5492d4d2c9clogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Баровия была богатой и пышной плодородной горной долиной и часто была покрыта облаками и туманами, которые сохраняли флору здоровой и красивой. Однако недостаточная видимость представляла собой головоломку для людей, пытающихся отследить сезон посадки с помощью неба.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Flogseq____&quot;,752,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Vlogseq____&quot;,752,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^Ulogseq____&quot;,643,536870992]],[logseq____&quot;^15logseq____&quot;,[736,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-ab19-4bb1-8602-32e5b2c595b7logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые короли прибыли в [Баровию]([[Баровия]]), они принесли с собой свою религию [Повелителя Утра]([[Церковь Утреннего Владыки]]). Были воздвигнуты церкви, и Повелитель Утра благословил каждого короля править народом. Повелитель Утра дорожил своими прекрасными восходами, поэтому он следил за тем, чтобы всепроникающие утренние туманы [Баровии]([[Баровия]]) регулярно рассеивались. Благодаря этому посевы фермеров становились крепче и выше, но постепенно пышная растительность Баровии начала выгорать и увядать. В конце концов, жители деревень забыли о Феях и начали носить подношения королю и его Повелителю Утра за безопасность. Они строили стены вокруг своих деревень, чтобы защитить их от дикой природы, а [Церковь Повелителя Утра]([[Церковь Утреннего Владыки]]) проповедовала о зле язычества и Фей.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Flogseq____&quot;,703,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Vlogseq____&quot;,703,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Ulogseq____&quot;,63,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Ulogseq____&quot;,246,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Hlogseq____&quot;,63,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^Hlogseq____&quot;,246,536870992]],[logseq____&quot;^15logseq____&quot;,[737,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-dcf9-4496-aa68-00f4b2f4f44elogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Водная Фея приняла человеческий облик и отправилась в замок принца, чтобы принести ему этот великий дар. Она объяснила, что тяжелое сердце принца исказило туманы, которые покрыли землю тьмой.  С Сердцем Скорби, извлекающим боль о своей потерянной любви, принц освободился бы от отчаяния и угрызений совести, которые сковывали его, восстановив землю и свое королевство. Принц был доволен подарком и магической силой Сердца Скорби, придавшей ему безудержного рвения к новому делу.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Flogseq____&quot;,757,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Vlogseq____&quot;,722,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^Ulogseq____&quot;,701,536870992]],[logseq____&quot;^15logseq____&quot;,[738,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-5663-4ab0-834f-cbefbc0fc3d3logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Вскоре принц стал познавать военное искусство, он начал завоевывать все новые и новые земли, пока не дошел до земель, о которых ему рассказывала Водная Фея. Она отчачянно хотела дать ему силы и сделать его повелителем этих земель.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Flogseq____&quot;,733,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Vlogseq____&quot;,721,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[739,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-67c7-41d4-9c92-65727f23290dlogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей [одинокой башне]([[Одинокая Башня]]), чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Flogseq____&quot;,748,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Vlogseq____&quot;,748,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,494,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,644,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,692,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Ulogseq____&quot;,693,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Hlogseq____&quot;,494,536870992]],[logseq____&quot;^15logseq____&quot;,[740,logseq____&quot;^Hlogseq____&quot;,644,536870992]],[logseq____&quot;^15 азалось, у них был свой собственный разум. Туман окутал долину, и круговорот жизни землился. Признаки зарождения жизни весной исчезли, животные рождались с пустыми темными глазами, цветы больше не распускались, а яйца были черными. В лесах появились новые ужасные существа, посевы начали гнить, и земля потемнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^Flogseq____&quot;,750,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^Xlogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^Vlogseq____&quot;,732,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^Ulogseq____&quot;,165,536870992]],[logseq____&quot;^15logseq____&quot;,[749,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6aa47945-02ce-4c5f-855d-87f0f52290d8logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[750,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда война закончилась, принц одержал победу и объявил землю своей собственностью. Феи увидели, как тьма разрастается в принце - тьма, которую когда-то считали давно забытой и заточенной в [Янтарном храме]([[Янтарный храм]]). [Повелитель Утра]([[Церковь Утреннего Владыки]]) был изгнан, и туманы вернулись на земли [Баровии]([[Баровия]]) с удвоенной силой. Тьма накатила и поплыла в густом черном дыму войны, который тяжело висел в воздухе Баровии. Густой туман покрыл земли холодной серой бледностью. Туманы ослабили магию Фей и нарушили их связь с землей и самим циклом жизни.logseq_
