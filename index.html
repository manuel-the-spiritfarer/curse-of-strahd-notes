5-3be3-44cb-a4f9-fdc7f37ebdfalogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Flogseq____&quot;,721,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Vlogseq____&quot;,734,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[701,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-b79d-4d52-8baa-bc26416d464blogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда война закончилась, принц одержал победу и объявил землю своей собственностью. Феи увидели, как тьма разрастается в принце - тьма, которую когда-то считали давно забытой и заточенной в [Янтарном храме]([[Янтарный храм]]). [Повелитель Утра]([[Церковь Утреннего Владыки]]) был изгнан, и туманы вернулись на земли [Баровии]([[Баровия]]) с удвоенной силой. Тьма накатила и поплыла в густом черном дыму войны, который тяжело висел в воздухе Баровии. Густой туман покрыл земли холодной серой бледностью. Туманы ослабили магию Фей и нарушили их связь с землей и самим циклом жизни.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Flogseq____&quot;,697,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Vlogseq____&quot;,734,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Ulogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Ulogseq____&quot;,242,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Ulogseq____&quot;,679,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Hlogseq____&quot;,60,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Hlogseq____&quot;,242,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^Hlogseq____&quot;,679,536870991]],[logseq____&quot;^15logseq____&quot;,[702,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-497d-4166-a9ff-c444512b99aalogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Содержание:logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Flogseq____&quot;,691,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Vlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[703,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6 quot;^15logseq____&quot;,[716,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-ca35-4e03-858f-cb5bc926948dlogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Здесь написана сага о Ба Лы, или \\logseq____&quot;Сага о трех\\logseq____&quot;, друидическая история о трех Феях, которые в древние времена заботились о землях Баровии и, как мать любит своих собственных детей, лелеяли и их святые храмы.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Flogseq____&quot;,703,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Vlogseq____&quot;,703,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-f8c0-4bf6-953b-12911df60ed3logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Храмы, круги монолитовlogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Flogseq____&quot;,709,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Vlogseq____&quot;,703,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-7d7c-4cd0-99d1-f34812e1fdd6logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&qu _&quot;^15logseq____&quot;,[720,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-b3f8-4738-948e-0bc762d97c2flogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В туманах было что-то неопределимое. Казалось, у них был свой собственный разум. Туман окутал долину, и круговорот жизни землился. Признаки зарождения жизни весной исчезли, животные рождались с пустыми темными глазами, цветы больше не распускались, а яйца были черными. В лесах появились новые ужасные существа, посевы начали гнить, и земля потемнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Flogseq____&quot;,702,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Vlogseq____&quot;,734,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[721,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-5106-46e6-ae2b-0d44d877b650logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Flogseq____&quot;,695,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Vlogseq____&quot;,720,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[722,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-ea39-4be0-af28-d74274f17329logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Баба Лысагаlogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Flogseq____&quot;,740,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Vlogseq____&quot;,703,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[723,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-c817-4d86-9a28-240c2018e0bflogseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[724,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с й самоцвет, спасти Водную Фею и восстановить разрушенный Храм. Только тогда три Феи и их самоцветы могли объединиться, чтобы победить темного принца. Им нужно было найти других героев, заслуживающих доверия и достаточно сильных, чтобы противостоять темному принцу и его приспешникам. В долине не было никого, к кому они могли бы обратиться, и им пришлось бы найти по-настоящему могущественных и стойких приключенцев, которые помогли бы им. Феи прятались от темного принца и его приспешников до тех пор, пока не смогли бы найти тех, кто достаточно силен, чтобы противостоять принцу, а затем сделали бы их теми, кто смог бы противостоять в битве против этого мастера тактики.logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^Flogseq____&quot;,713,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^Xlogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^Vlogseq____&quot;,740,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^Ulogseq____&quot;,161,536870991]],[logseq____&quot;^15logseq____&quot;,[744,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a8ade55-96f3-43b0-a047-caaa7a61f487logseq____&quot;,536870991]],[logseq____&quot;^15logseq____&quot;,[746,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;template-type:: location\\ntype:: Церковь\\n\\nlogseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[746,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870992]],[logseq____&quot;^15logseq____&quot;,[746,logseq____&quot;^1?logseq____&quot;,[logseq____&quot;^1logseq____&gt;logseq____&quot;,[]],536870992]],[logseq____&quot;^15logseq____&quot;,[746,logseq____&quot;^Flogseq____&quot;,240,536870992]],[logseq____&quot;^15logseq____&quot;,[746,logseq____&quot;^Xlogseq____&quot;,240,536870992]],[logseq____&quot;
