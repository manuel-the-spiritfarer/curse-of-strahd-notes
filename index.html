ти по-настоящему могущественных и стойких приключенцев, которые помогли бы им. Феи прятались от темного принца и его приспешников до тех пор, пока не смогли бы найти тех, кто достаточно силен, чтобы противостоять принцу, а затем сделали бы их теми, кто смог бы противостоять в битве против этого мастера тактики.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^Flogseq____&quot;,541,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^Vlogseq____&quot;,540,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[553,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-74e5-4649-b8ba-447878164f1blogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[554,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ни для кого не было секретом, что сестры Феи питали слабость к новорожденным. Было известно, что они иногда следовали из своих диких мест на крики новорожденных, чтобы навестить молодых матерей в сельской местности. Оказавшись там, они заискивали перед ребенком, затем желали матери и ребенку всего наилучшего и оставляли их в покое. В редких случаях, если ребенок рождался весной, новорожденные оленята сопровождали Фей, чтобы навестить новорожденных младенцев, укрепляя связь между людьми и животными долины.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[554,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[554,logseq____&quot;^Flogseq____&quot;,569,536870981]],[logseq____&quot;^15logseq____&quot;,[554,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[554,logseq____&quot;^ приняла человеческий облик и отправилась в замок принца, чтобы принести ему этот великий дар. Она объяснила, что тяжелое сердце принца исказило туманы, которые покрыли землю тьмой.  С Сердцем Скорби, извлекающим боль о своей потерянной любви, принц освободился бы от отчаяния и угрызений совести, которые сковывали его, восстановив землю и свое королевство. Принц был доволен подарком и магической силой Сердца Скорби, придавшей ему безудержного рвения к новому делу.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Flogseq____&quot;,556,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Vlogseq____&quot;,538,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^Ulogseq____&quot;,529,536870981]],[logseq____&quot;^15logseq____&quot;,[558,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-ce8a-4b5e-93aa-80aa00337c97logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Обманом Водная Фея заставила своих сестер создать Сердце Скорби и вручить его в подарок принцу, а взамен она получила его благосклонность и сердце серебренного дракона [Аргинвоста]([[Аргинвост]]), что когда-то знала.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Flogseq____&quot;,535,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Vlogseq____&quot;,530,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Ulogseq____&quot;,51,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^Hlogseq____&quot;,51,536870981]],[logseq____&quot;^15logseq____&quot;,[559,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-49d1-402c-b564-abe0dd59ce10logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Лесная Фея превратилась в человека и жила среди народа Валлаки. Она держит глаза и уши открытыми, выискивая тех, кто мог бы оказать помощь и наблюдая за теми, кто служит темному принцу. Горная Фея исчезла в поисках тех, кто был достаточно храбр, чтобы помочь им и кто готов встретиться лицом к лицу с темным принцем.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Flogseq____&quot;,553,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Vlogseq____&quot;,540,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[560,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-7554-47b8-8cf8-bca4a6ed5288logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Горная и Лесная Феи выкопали свои самоцветы и вместе отправились в Храм Водной Феи на берегу реки близ [Береза]([[Берез]]). Но приспешники принца уже осквернили Храм, и голубой самоцвет пропал. Опасаясь, что голубой самоцвет попал в руки темного принца, который заключил в тюрьму их сестру, Феи нуждались в помощи, но жители Баровии больше не верили в Фей. На протяжении многих поколений они поклонялись Повелителю Утра и платили дань своему новому повелителю Баровии, темному принцу.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Flogseq____&quot;,566,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Vlogseq____&quot;,540,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Ulogseq____&quot;,64,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^Hlogseq____&quot;,64,536870981]],[logseq____&quot;^15logseq____&quot;,[561,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-cf9d-416b-a234-44ebb110ada6logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В самый длинный день лета, в день летнего солнцестояния, когда солнце было в зените, друиды приходили к каждому из Храмов, возлагали цветы вокруг монолитов и благодарили Фей за чудесную весну. В самую длинную ночь, в день зимнего солнцестояния, друиды зажигали свечи и приносили свежие, теплые буханки хлеба в качестве подарков, чтобы согреть Фей долгими зимними ночами.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Flogseq____&quot;,565,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Vlogseq____&quot;,576,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[562,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-3877-49a3-8358-a0b8907c45f3logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда война закончилась, принц одержал победу и объявил землю своей собственностью. Феи увидели, как тьма разрастается в принце - тьма, которую когда-то считали давно забытой и заточенной в [Янтарном храме]([[Янтарный храм]]). [Повелитель Утра]([[Церковь Утреннего Владыки]]) был изгнан, и туманы вернулись на земли [Баровии]([[Баровия]]) с удвоенной силой. Тьма накатила и поплыла в густом черном дыму войны, который тяжело висел в воздухе Баровии. Густой туман покрыл земли холодной серой бледностью. Туманы ослабили магию Фей и нарушили их связь с землей и самим циклом жизни.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Flogseq____&quot;,579,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Vlogseq____&quot;,548,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Ulogseq____&quot;,60,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Ulogseq____&quot;,507,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Ulogseq____&quot;,520,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Hlogseq____&quot;,60,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Hlogseq____&quot;,507,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^Hlogseq____&quot;,520,536870981]],[logseq____&quot;^15logseq____&quot;,[563,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-b883-40c6-8c9f-a8b83e4f8e23logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Помогая королеве, ухаживая за ней, она стала приближенной королевского двора и вскоре при рождении принца стала его повитухой. И с первых же мгновений жизни она возлюбила это дитя как собственное, несмотря на то, что сам принц за время, проведенное с Феей, не питал ни любви, ни теплых чувств к ней.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Flogseq____&quot;,571,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Vlogseq____&quot;,530,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[564,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-c126-4936-b5c1-af0fb75bb4a7logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Этот орден друидов создал три каменных круга, известных как Храмы, каждый из которых предназначался своей Фее. Первый каменный круг был построен на краю леса как дань уважения Лесной Фее. Еще один храм был построен вдоль реки как дань уважения Водной Фее. Третий же храм был построен на холме, обращенный к великим горам, как дань уважения Горной Фее.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Flogseq____&quot;,576,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Vlogseq____&quot;,576,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[565,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-98d5-4149-b6fc-f358c5ac0cbclogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о темных планах принца.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Flogseq____&quot;,540,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Vlogseq____&quot;,540,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[566,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-c386-4b74-b723-eb46504cab5elogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[567,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ, чтобы уничтожить всех врагов темного принца и деревни смертных, которых она винит во всем, что произошло.logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[567,logseq____&qu 568,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[568,logseq____&quot;^Ulogseq____&quot;,527,536870981]],[logseq____&quot;^15logseq____&quot;,[568,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-e06a-4c66-a955-6f442847e2cclogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;На протяжении веков люди жили в долине в гармонии с природой и чувствовали себя благословленными Феями. Четыре раза в год друиды искали знаки в храмах, читали ритуальные стихи и приносили подарки Феям:logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Flogseq____&quot;,544,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Vlogseq____&quot;,544,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[569,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0b3-1544-4335-9d0c-6b6223a55ab8logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Лесная Фея следила за растениями и животнымиlogseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Flogseq____&quot;,534,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Xlogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Vlogseq____&quot;,534,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq____&quot;^Ulogseq____&quot;,160,536870981]],[logseq____&quot;^15logseq____&quot;,[570,logseq_
