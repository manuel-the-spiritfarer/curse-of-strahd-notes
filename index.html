тавили свои самоцветы в своих Храмах, приказав ордену друидов закопать самоцветы под кругами монолитов. Во время весеннего равноденствия, летнего солнцестояния, осеннего равноденствия и зимнего солнцестояния на каждом храме светился символ, говорящий друидам о том, когда фермерам Баровии следует сажать и убирать урожай. Символы также указывали, когда владельцы ферм должны перегонять свои стада на свежие летние пастбища, а когда возвращать их домой на зиму.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Flogseq____&quot;,436,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Vlogseq____&quot;,436,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^Ulogseq____&quot;,390,536870965]],[logseq____&quot;^15logseq____&quot;,[415,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-aeff-45e2-a174-1129bbddafadlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Их сестру заперли, а их храмы осквернили, Сестры-Феи спрятали два оставшихся самоцвета. Лесная Фея доверила свой зеленый самоцвет воронам-оборотням, которые показали себя как благородные и преданные создания. Горная Фея доверила свой красный самоцвет старому волшебнику, живущему в башне, которого она знала и которому доверяла. ([Хазан]([[Хазан]]))logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Flogseq____&quot;,431,536870965]],[logseq____&quot;^15logseq____&quot;,[416,logseq____&quot;^Xlogseq____&q ыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Flogseq____&quot;,447,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Vlogseq____&quot;,447,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Ulogseq____&quot;,382,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Ulogseq____&quot;,383,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Ulogseq____&quot;,390,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Hlogseq____&quot;,382,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^Hlogseq____&quot;,390,536870965]],[logseq____&quot;^15logseq____&quot;,[433,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-1e9b-4a88-8b6b-876a13e0560clogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Баба Лысагаlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Flogseq____&quot;,412,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Vlogseq____&quot;,398,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[434,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-aea6-422b-bf82-5c6ad06e3d60logseq____&quot;,536870965]],[ ddlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В самый длинный день лета, в день летнего солнцестояния, когда солнце было в зените, друиды приходили к каждому из Храмов, возлагали цветы вокруг монолитов и благодарили Фей за чудесную весну. В самую длинную ночь, в день зимнего солнцестояния, друиды зажигали свечи и приносили свежие, теплые буханки хлеба в качестве подарков, чтобы согреть Фей долгими зимними ночами.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Flogseq____&quot;,423,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Vlogseq____&quot;,437,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[439,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-b27d-4a63-bf7f-e40a86c810c2logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Лесная Фея превратилась в человека и жила среди народа Валлаки. Она держит глаза и уши открытыми, выискивая тех, кто мог бы оказать помощь и наблюдая за теми, кто служит темному принцу. Горная Фея исчезла в поисках тех, кто был достаточно храбр, чтобы помочь им и кто готов встретиться лицом к лицу с темным принцем.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Flogseq____&quot;,394,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Vlogseq____&quot;,412,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[440,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-c71e-4f14-b3d9-5125eaaa8d41logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ, чтобы уничтожить всех врагов темного принца и деревни смертных, которых она винит во всем, что произошло.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Flogseq____&quot;,401,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Vlogseq____&quot;,434,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ulogseq____&quot;,41,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ulogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Hlogseq____&quot;,41,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^Hlogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[441,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-97e3-4197-a57e-22d7c9fbb718logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В туманах было что-то неопределимое. Казалось, у них был свой собственный разум. Туман окутал долину, и круговорот жизни землился. Признаки зарождения жизни весной исчезли, животные рождались с пустыми темными глазами, цветы больше не распускались, а яйца были черными. В лесах появились новые ужасные существа, посевы начали гнить, и земля потемнела. Тьма обрушилась и на деревни, поскольку рождались младенцы, которые не плакали и не смеялись; некоторые верили, что они бездушны. Когда Феи узнали о всем том, что происходит в долине, они были глубоко встревожены и обезумели. Их мольбы к высшим силам остались без ответа. Что-то было не так с естественным порядком вещей.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Flogseq____&quot;,397,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Vlogseq____&quot;,418,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[442,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-277c-40b0-a65f-ada8aa5352f5logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[443,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;template-type:: document\\ntype:: Книга\\n\\nlogseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[443,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[443,logseq____&quot;^1logseq____&gt;logseq____&quot;,[logseq____&quot;^1?logseq____&quot;,[]],536870965]],[logseq____&quot;^15logseq____&quot;,[443,logseq____&quot;^Flogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quo q____&quot;^Vlogseq____&quot;,434,536870965]],[logseq____&quot;^15logseq____&quot;,[444,logseq____&quot;^Ulogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[444,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[444,logseq____&quot;^Hlogseq____&quot;,45,536870965]],[logseq____&quot;^15logseq____&quot;,[444,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-1143-4916-863e-068a833964f2logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что им нужно вернуть сердце принца и рассеять тьму, которая окружала его, чтобы исцелить туманы, окутавшие долину и задушившие жизнь самой земли. Феи разломили свои самоцветы пополам и использовали часть оставшейся силы, чтобы соединить три половинки в великий артефакт и сформировать Сердце Скорби. Феи вложили свою любовь к жизни и долине в новый драгоценный камень и наделили его способностью поглощать печаль и тьму из сердца принца.logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Flogseq____&quot;,393,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Xlogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Vlogseq____&quot;,393,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Ulogseq____&quot;,128,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^Ulogseq____&quot;,392,536870965]],[logseq____&quot;^15logseq____&quot;,[445,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a6cc8d6-305d-4ef6-8c7f-f05a7b3ed193logseq____&quot;,536870965]],[logseq____&quot;^15logseq____&quot;,[446,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял с
