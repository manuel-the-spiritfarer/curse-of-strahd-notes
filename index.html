рном дыму войны, который тяжело висел в воздухе Баровии. Густой туман покрыл земли холодной серой бледностью. Туманы ослабили магию Фей и нарушили их связь с землей и самим циклом жизни.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Flogseq____&quot;,689,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Vlogseq____&quot;,721,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Ulogseq____&quot;,60,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Ulogseq____&quot;,242,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Ulogseq____&quot;,665,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Hlogseq____&quot;,60,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Hlogseq____&quot;,242,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^Hlogseq____&quot;,665,536870988]],[logseq____&quot;^15logseq____&quot;,[678,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-808c-4c3a-822d-d4c8dd49d930logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Феи верили, что облако тьмы, окружавшее принца, породило ужасные туманы,. Говорили, что принц потерял своего брата и свою настоящую любовь во время великой войны. Сердце принца было полно тьмы и печали и кроме этого в нем не было ничего больше. Он потратил много времени на поиски тела своей потерянной любви, и его сердце было бездонной пропастью отчаяния. Опора и стать принца были подорваны, что влияло на все вокруг него. Бремя егго утраты было так тяжело, что оно окутало землю великой тьмой и повлияло на сами туманы.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Flogseq____&quot;,701,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Vlogseq____&quot;,721,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[679,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-71c9-4426-bbcc-9c0a5e6d75a8logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;В скором времени Болотная Фея начала ожесточаться, видя как новые приключенцы попадают в эти земли и пытаются убить ее столь любимого \\logseq____&quot;сына\\logseq____&quot;.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Flogseq____&quot;,697,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Vlogseq____&quot;,684,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[680,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-6ede-45a2-8c54-efe0f187033blogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[681,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Ворон-оборотень в облике ворона сидел в окне замка, подслушивая, что происходило между принцем и Водной Феей. Ворон-оборотень летел быстрее, чем выполнялись приказы принца, и предупредил двух других Сестер-Фей и друидов о т ^Qlogseq____&quot;,logseq____&quot;Она вернулась в болотные руины [Береза]([[Берез]]) и начала использовать свои новоприобретенные силы темной магии, создавая существ тьмы и людей-лягушек, известных как булливаги, чтобы они служили ей. Она заключила договоры с каргами и болотными ведьмами, своими шпионами в [Баровии]([[Баровия]]). Другие темные существа бродят по болотам, а некоторые из них столкнулись с ее темными экспериментами. Некоторые верят, что она собирает армию болотных существ, чтобы уничтожить всех врагов темного принца и деревни смертных, которых она винит во всем, что произошло.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Flogseq____&quot;,693,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Vlogseq____&quot;,684,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Ulogseq____&quot;,60,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Ulogseq____&quot;,64,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Hlogseq____&quot;,60,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^Hlogseq____&quot;,64,536870988]],[logseq____&quot;^15logseq____&quot;,[710,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-03bc-4f7b-81c6-d1d77fa1f5b6logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[711,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Цветок Тсер на день весеннего равноденствияlogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[711,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[711,logseq____&quot; ую Фею и восстановить разрушенный Храм. Только тогда три Феи и их самоцветы могли объединиться, чтобы победить темного принца. Им нужно было найти других героев, заслуживающих доверия и достаточно сильных, чтобы противостоять темному принцу и его приспешникам. В долине не было никого, к кому они могли бы обратиться, и им пришлось бы найти по-настоящему могущественных и стойких приключенцев, которые помогли бы им. Феи прятались от темного принца и его приспешников до тех пор, пока не смогли бы найти тех, кто достаточно силен, чтобы противостоять принцу, а затем сделали бы их теми, кто смог бы противостоять в битве против этого мастера тактики.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^Flogseq____&quot;,683,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^Vlogseq____&quot;,722,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[713,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-db4e-403a-a861-870c355704eblogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Друиды, чьи верования больше не приветствовались в деревнях, переехали в небольшую рощу в дальнем уголке Баровии и навсегда бросили молодое королевство на произвол судьбы. Друиды продолжали носить подношения Феям. Фермеры, втайне, чтобы не проявить неуважения к королю и его Утреннему Лорду, также приносили подношения Феям, поскольку они знали, что именно Феи были стражами, которые защищали землю и обеспечивали гармонию в долине.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Flogseq____&quot;,718,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Vlogseq____&quot;,723,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[714,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-e736-43df-837d-6ff80f86ddb9logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[715,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Прошли столетия, затем внезапно Темные Силы вторглись в долину. Феи и друиды вместе сражались против Темных Сил, но не смогли победить их. Феи поделились с друидами своими знаниями о могущественной магии [Янтарной горы]([[Янтарная гора]]). Зная, что янтарь может использовать магию фей, они задались вопросом, может ли он, янтарь, сдерживать Темные Силы, наводнившие долину. Феи и друиды собрали каждую унцию волшебного янтаря в горах, чтобы создать секретный храм, чтобы заточить тьму подальше от долины и людей. Молодой друид [Хазан]([[Хазан]]) стал первым хранителем [Янтарного храма]([[Янтарный храм]), сохранив в тайне назначение храма и защитив долину от тьмы. [Хазан]([[Хазан]]) изучал магию, став великим волшебником, и обучал других друидов, чтобы они стали волшебниками тайного ордена, защищающего [Янтарный храм]([[Янтарный храм]). В конце концов [Хазан]([[Хазан]]) вернулся в долину, доживая свой век в своей одинокой башне, чтобы изучать магию и предлагать свои знания тем, кто их искал. [Янтарный храм]([[Янтарный храм]) стал величайшей тайной долины. Прошли столетия, и друиды, и те, кто жил в долине, забыли о храме и своих собратьях, его волшебниках-хранителях.logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[715,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq__ -9440-64b94083a80alogseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;До того, как смертные поселились в долине, известной как Баровия, три небесных существа - сестры Феи - следили за флорой, фауной и землей. Вместе в своем единстве они были Матерью-природой, заботящейся о долине. Каждая из сестер-Фей по-своему дарила долине свою любовь и заботу:logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Ologseq____&quot;,logseq____&quot;^16logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Flogseq____&quot;,691,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Xlogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Vlogseq____&quot;,691,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Ulogseq____&quot;,161,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^Ulogseq____&quot;,632,536870988]],[logseq____&quot;^15logseq____&quot;,[717,logseq____&quot;^;logseq____&quot;,logseq____&quot;~u6a89a0ce-0e43-4a7f-adeb-bbc705d07614logseq____&quot;,536870988]],[logseq____&quot;^15logseq____&quot;,[718,logseq____&quot;^Qlogseq____&quot;,logseq____&quot;Когда первые короли прибыли в [Баровию]([[Баровия]]), они принесли с собой свою религию [Повелителя Утра]([[Церковь Утреннего Владыки]]). Были воздвигнуты церкви, и Повелитель Утра благословил каждого короля править народом. Повелитель Утра дорожил своими прекрасными восходами, поэтому он следил за тем, чтобы всепроникающие утренние туманы [Баровии]([[Баровия]]) регулярно рассеивались. Благодаря этому посевы фермеров становились крепче и выше, но постепенно пышная растительность Баровии начала выгорать и увядать. В конце концов, жители деревень забыли о Феях и начали носить подношения королю и его Повелителю Утра за безопасность. Они строили стены вокруг своих деревень, чтобы защитить их от дикой прир
